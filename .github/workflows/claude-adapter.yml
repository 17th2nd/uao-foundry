name: UAO Foundry post-remediation backup control

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read
  actions: read

jobs:
  accession-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify canonical main and native post-merge CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA='2bc2871d2a7c36c9b4d67881d40827ff2e948d2e'
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          git switch --detach "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"

          expected=("UAO Foundry CI" "UAO Foundry provider protocol" "UAO Foundry semantic delta")
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${MAIN_SHA}&per_page=100"
          complete=0
          for attempt in $(seq 1 36); do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" > /tmp/main-runs.json
            complete=1
            for name in "${expected[@]}"; do
              count="$(jq --arg n "$name" --arg s "$MAIN_SHA" '[.workflow_runs[] | select(.event=="push" and .head_sha==$s and .name==$n and .status=="completed" and .conclusion=="success")] | length' /tmp/main-runs.json)"
              if [ "$count" -lt 1 ]; then complete=0; fi
            done
            if [ "$complete" -eq 1 ]; then break; fi
            sleep 10
          done
          if [ "$complete" -ne 1 ]; then
            jq --arg s "$MAIN_SHA" '[.workflow_runs[] | select(.head_sha==$s) | {id,name,event,status,conclusion,head_sha}]' /tmp/main-runs.json >&2
            echo 'Required native main push CI did not reach SUCCESS.' >&2
            exit 1
          fi
          mkdir -p /tmp/accession-evidence
          jq --arg s "$MAIN_SHA" '[.workflow_runs[] | select(.event=="push" and .head_sha==$s) | {id,name,event,status,conclusion,head_sha,run_number,created_at,updated_at,html_url}] | sort_by(.name)' /tmp/main-runs.json > /tmp/accession-evidence/NATIVE-MAIN-CI.json

      - name: Independent exact-main Maven verification
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA='2bc2871d2a7c36c9b4d67881d40827ff2e948d2e'
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          mvn -B -ntp clean verify | tee /tmp/accession-evidence/MAVEN-VERIFY.log

      - name: Build immutable recovery pack and prove restore
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA='2bc2871d2a7c36c9b4d67881d40827ff2e948d2e'
          BACKUP_BRANCH='backup/main-2026-08-11-post-remediation-2bc2871d'
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          TREE_SHA="$(git rev-parse "${MAIN_SHA}^{tree}")"
          mkdir -p /tmp/uao-foundry-recovery
          cd /tmp/uao-foundry-recovery

          git -C "$GITHUB_WORKSPACE" update-ref refs/heads/recovery-main "$MAIN_SHA"
          git -C "$GITHUB_WORKSPACE" bundle create "uao-foundry-main-${MAIN_SHA}.bundle" refs/heads/recovery-main
          git -C "$GITHUB_WORKSPACE" bundle verify "$(pwd)/uao-foundry-main-${MAIN_SHA}.bundle" > BUNDLE-VERIFY.txt 2>&1
          git -C "$GITHUB_WORKSPACE" archive --format=tar.gz --prefix="uao-foundry-${MAIN_SHA}/" -o "$(pwd)/uao-foundry-source-${MAIN_SHA}.tar.gz" "$MAIN_SHA"

          cp /tmp/accession-evidence/NATIVE-MAIN-CI.json .
          cp /tmp/accession-evidence/MAVEN-VERIFY.log .

          cat > BACKUP-MANIFEST.txt <<EOF
          UAO FOUNDRY POST-REMEDIATION RECOVERY MANIFEST
          generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          repository=${GITHUB_REPOSITORY}
          canonical_main_sha=${MAIN_SHA}
          canonical_tree_sha=${TREE_SHA}
          squash_pr=13
          accepted_r2_head=92f9247fcc7f89ba8a1f10b8273fd7c2034ae2f9
          permanent_backup_branch=${BACKUP_BRANCH}
          authority_created_here=false
          asa_relationship_type_role_authority=NOT_FOUND_IN_CURRENT_CSS_AUTHORITY_SURFACE
          bundle_scope=history reachable from canonical main via refs/heads/recovery-main
          source_archive_scope=exact canonical main tree
          native_main_ci_evidence=NATIVE-MAIN-CI.json
          exact_main_maven_evidence=MAVEN-VERIFY.log
          recovery_proof=RECOVERY-VERIFICATION.txt
          EOF

          sha256sum \
            "uao-foundry-main-${MAIN_SHA}.bundle" \
            "uao-foundry-source-${MAIN_SHA}.tar.gz" \
            BACKUP-MANIFEST.txt \
            NATIVE-MAIN-CI.json \
            MAVEN-VERIFY.log \
            BUNDLE-VERIFY.txt > SHA256SUMS.txt

          rm -rf /tmp/uao-foundry-clean-restore
          git clone "uao-foundry-main-${MAIN_SHA}.bundle" /tmp/uao-foundry-clean-restore
          git -C /tmp/uao-foundry-clean-restore checkout --detach "$MAIN_SHA"
          RESTORED_SHA="$(git -C /tmp/uao-foundry-clean-restore rev-parse HEAD)"
          RESTORED_TREE="$(git -C /tmp/uao-foundry-clean-restore rev-parse HEAD^{tree})"
          test "$RESTORED_SHA" = "$MAIN_SHA"
          test "$RESTORED_TREE" = "$TREE_SHA"
          git -C /tmp/uao-foundry-clean-restore fsck --full

          mkdir -p /tmp/source-restore
          tar -xzf "uao-foundry-source-${MAIN_SHA}.tar.gz" -C /tmp/source-restore
          test -f "/tmp/source-restore/uao-foundry-${MAIN_SHA}/README.md"

          cat > RECOVERY-VERIFICATION.txt <<EOF
          recovery_status=PASS
          restored_commit=${RESTORED_SHA}
          restored_tree=${RESTORED_TREE}
          expected_commit=${MAIN_SHA}
          expected_tree=${TREE_SHA}
          git_fsck=PASS
          source_archive_extract=PASS
          EOF
          sha256sum RECOVERY-VERIFICATION.txt >> SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: uao-foundry-post-remediation-recovery-2bc2871d
          path: /tmp/uao-foundry-recovery/
          if-no-files-found: error
          retention-days: 90
