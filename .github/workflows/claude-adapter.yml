name: UAO Foundry Claude Code adapter

on:
  push:
    branches:
      - "sprint/**"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python adapter unit tests
        run: python3 -m unittest discover -s adapters/claude-code/tests -p 'test_*.py' -v

      - name: Existing Java tests
        run: mvn -B -ntp clean verify

      - name: Package executable
        run: mvn -B -ntp package -DskipTests

      - name: Install fake Claude Code executable
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fake-claude <<'PY'
          #!/usr/bin/env python3
          import json
          import re
          import sys

          if "--version" in sys.argv:
              print("2.1.999-ci-fake")
              raise SystemExit(0)

          prompt = sys.stdin.read()
          match = re.search(r"BEGIN_FOUNDRY_ENVELOPE_JSON\n(.*?)\nEND_FOUNDRY_ENVELOPE_JSON", prompt, re.S)
          if not match:
              print("missing Foundry envelope", file=sys.stderr)
              raise SystemExit(10)
          envelope = json.loads(match.group(1))
          seed = envelope["request"]["identitySeed"]
          slug = re.sub(r"[^a-z0-9]+", "-", seed.lower()).strip("-") or "identity"
          context = envelope.get("registryContext") or {}
          matches = context.get("matches") or []

          if matches:
              identity = matches[0]["identity"]
              resolution = identity["resolutionKey"]
              occurrence = identity["occurrences"][0]
              package_id = occurrence["packageId"]
              canonical_path = occurrence["canonicalPath"]
              prefix = f"packages/{package_id}/"
              if not canonical_path.startswith(prefix):
                  print("invalid registry occurrence", file=sys.stderr)
                  raise SystemExit(11)
              locator = f"registry://{package_id}/{canonical_path[len(prefix):]}"
              source_class = "foundry-registry"
              source_content = "FAKE MODEL TRANSCRIPTION MUST BE REPLACED BY ADAPTER"
              source_license = "FAKE-MODEL"
          else:
              resolution = f"foundry:v0.1:ci:{slug}"
              locator = "https://example.invalid/uao-foundry-ci"
              source_class = "synthetic-ci-reference"
              source_content = f"Synthetic CI evidence for {seed}."
              source_license = "TEST-SYNTHETIC"

          bundle = {
              "fixtureVersion": "0.1.0",
              "identitySeed": seed,
              "fixedClock": "2000-01-01T00:00:00Z",
              "knowledgeHorizon": "2000-01-01T00:00:00Z",
              "interpretations": [{
                  "candidateId": "int-root",
                  "label": seed,
                  "definition": f"CI-selected interpretation of {seed}.",
                  "semanticTypeProposal": "CIIdentity",
                  "confidence": 0.9,
                  "status": "SELECTED",
                  "references": [locator]
              }],
              "scopeResolution": {
                  "selectedInterpretation": "int-root",
                  "scopeStatus": "MACHINE_SELECTED_EXPERIMENTAL",
                  "canonicalWorkingLabel": seed,
                  "includedBoundaries": ["CI identity scope"],
                  "excludedBoundaries": [],
                  "excludedInterpretations": [],
                  "unresolvedQuestions": []
              },
              "manufacturingPlan": {
                  "planVersion": "0.1.0",
                  "selectedIdentity": seed,
                  "dimensions": ["identity"],
                  "neighbouringIdentities": [],
                  "anticipatedSourceClasses": [source_class],
                  "risks": [],
                  "completionQuestions": [{
                      "questionId": "q-identity",
                      "prompt": "Is the selected identity evidenced?",
                      "required": True
                  }],
                  "exclusions": []
              },
              "sourceStrategy": {
                  "strategyVersion": "0.1.0",
                  "sourceClasses": [{"classId": source_class, "purpose": "CI evidence", "priority": 1}],
                  "authorityNotes": ["Fake Claude CI provider; non-authoritative."],
                  "safetyConstraints": ["No external network call in CI fake."]
              },
              "sources": [{
                  "sourceId": "src-root",
                  "locator": locator,
                  "sourceClass": source_class,
                  "retrievedAt": "2000-01-01T00:00:00Z",
                  "license": source_license,
                  "content": source_content
              }],
              "candidates": {
                  "identities": [{
                      "candidateId": "cid-root",
                      "label": seed,
                      "resolutionKey": resolution,
                      "root": True,
                      "aliases": [],
                      "sourceRefs": ["src-root"],
                      "externalIdentifiers": {}
                  }],
                  "claims": [{
                      "candidateId": "clm-root",
                      "subjectIdentityRef": "cid-root",
                      "statement": f"CI evidence-backed identity assertion for {seed}.",
                      "channels": ["foundry"],
                      "sourceRefs": ["src-root"]
                  }],
                  "relationships": [],
                  "evidence": [{
                      "evidenceId": "ev-root",
                      "sourceRef": "src-root",
                      "supportsCandidateRef": "clm-root",
                      "extract": "Synthetic CI evidence.",
                      "locatorWithinSource": "ci"
                  }],
                  "states": [],
                  "events": [],
                  "languageMappings": []
              },
              "coverageAnswers": {"q-identity": "covered"}
          }
          print(json.dumps({"type": "result", "structured_output": bundle}, separators=(",", ":")))
          PY
          chmod 700 /tmp/fake-claude
          /tmp/fake-claude --version

      - name: Registry-aware fake-Claude manufacture and semantic reuse
        shell: bash
        env:
          UAO_FOUNDRY_CLAUDE_BIN: /tmp/fake-claude
          UAO_FOUNDRY_FIXED_CLOCK: "2026-08-10T00:00:00Z"
        run: |
          set -euo pipefail
          rm -rf /tmp/uao-sprint-registry /tmp/uao-sprint-work /tmp/uao-sprint-dist

          first="$(bash scripts/manufacture-claude.sh \
            "adapter integration identity" \
            --registry /tmp/uao-sprint-registry \
            --work-dir /tmp/uao-sprint-work \
            --dist-dir /tmp/uao-sprint-dist \
            --repository-commit "$GITHUB_SHA" \
            --register)"
          printf '%s\n' "$first" | jq .
          printf '%s\n' "$first" | jq -e '
            .verificationPassed == true and
            .publicationStatus == "EXPERIMENTAL" and
            .reuse.counts.newUaoCount == 1 and
            .reuse.counts.reusedUaoCount == 0'

          java -cp target/uao-foundry-0.1.0.jar \
            org.seventeenthsecond.uaofoundry.registry.RegistryApplication \
            verify --registry /tmp/uao-sprint-registry | jq -e '.passed == true'

          second="$(bash scripts/manufacture-claude.sh \
            "adapter integration identity" \
            --registry /tmp/uao-sprint-registry \
            --work-dir /tmp/uao-sprint-work \
            --dist-dir /tmp/uao-sprint-dist \
            --repository-commit "$GITHUB_SHA" \
            --register)"
          printf '%s\n' "$second" | jq .
          printf '%s\n' "$second" | jq -e '
            .verificationPassed == true and
            .publicationStatus == "EXPERIMENTAL" and
            .reuse.counts.reusedUaoCount >= 1 and
            .reuse.counts.registrySourceCount >= 1'

          package="$(printf '%s\n' "$second" | jq -r .packagePath)"
          java -jar target/uao-foundry-0.1.0.jar verify "$package" | jq -e '.passed == true'
          grep -F 'registry://' "$package/source-registry.json"
          grep -F 'UAO-FOUNDRY-REGISTRY-SNAPSHOT' "$package/provider-snapshot.json"

          java -cp target/uao-foundry-0.1.0.jar \
            org.seventeenthsecond.uaofoundry.registry.RegistryApplication \
            verify --registry /tmp/uao-sprint-registry | jq -e '.passed == true and .packageCount >= 2'

      - name: TAFE demonstration terms remain outside production implementation
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '\b(Certificate III Electrotechnology|Electric Vehicle Maintenance)\b' src/main/java adapters/claude-code/claude_provider.py; then
            echo 'TAFE demonstration identity leaked into generic implementation.' >&2
            exit 1
          fi

      - name: Python bytecode hygiene
        shell: bash
        run: |
          set -euo pipefail
          if find adapters -type d -name __pycache__ -print -quit | grep -q .; then
            echo '__pycache__ generated inside repository tree.' >&2
            exit 1
          fi
