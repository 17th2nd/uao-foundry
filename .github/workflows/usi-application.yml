name: USI Foundry application

on:
  push:
    branches: ["main", "programme/usi-**"]
  pull_request:
    branches: ["main"]

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: UI is bundled into the jar
        shell: bash
        run: |
          set -euo pipefail
          unzip -l target/uao-foundry-0.1.0.jar | grep -F 'app/index.html'
          unzip -l target/uao-foundry-0.1.0.jar | grep -F 'app/app.js'

      - name: Product language is USI, not legacy UAO
        shell: bash
        run: |
          set -euo pipefail
          # ADR-0003/0004: the operator interface speaks USI. Legacy terminology is permitted only
          # in comments and where a value genuinely is a legacy wire identifier.
          grep -F 'USI FOUNDRY' app/frontend/index.html
          if sed -E 's/<!--.*-->//g' app/frontend/index.html | grep -F 'UAO'; then
            echo 'Legacy UAO terminology leaked into product language.' >&2
            exit 1
          fi

      - name: No usi- identifier is minted by production code
        shell: bash
        run: |
          set -euo pipefail
          # ADR-0005: Option C is blocked by ASA CSS. The mapping may exist; nothing may call the
          # minting direction, and the audited core must not reference the seam at all.
          if grep -rn 'UsiIdentifiers.toUsi(' src/main/java; then
            echo 'Production code mints a usi- identifier.' >&2
            exit 1
          fi
          if grep -rn 'UsiIdentifiers\.' src/main/java/org/seventeenthsecond/uaofoundry; then
            echo 'The audited core references the migration seam.' >&2
            exit 1
          fi

      - name: Clean-room install and launch
        shell: bash
        run: |
          set -euo pipefail
          USI_FOUNDRY_PREFIX="$RUNNER_TEMP/prefix" USI_FOUNDRY_HOME="$RUNNER_TEMP/home" \
            bash app/packaging/install.sh
          USI_FOUNDRY_HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/prefix/bin/usi-foundry" --port 7788 --no-open &
          echo $! > "$RUNNER_TEMP/app.pid"
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:7788/api/status > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:7788/api/status | grep -F '"registryVerification":"PASS"'

      - name: Manufacture, register, rediscover and reuse through the API
        shell: bash
        run: |
          set -euo pipefail
          python3 app/packaging/smoke.py http://127.0.0.1:7788 "$RUNNER_TEMP/prefix/lib/usi-foundry/examples/demonstration"

      - name: Repeated accumulation does not collide (finding P9-1)
        shell: bash
        run: |
          set -euo pipefail
          python3 app/packaging/smoke.py http://127.0.0.1:7788 \
            "$RUNNER_TEMP/prefix/lib/usi-foundry/examples/demonstration" --accumulate 10

      - name: Relationship staging is fail-closed and non-canonical (§18)
        shell: bash
        run: |
          set -euo pipefail
          python3 app/packaging/smoke.py http://127.0.0.1:7788 \
            "$RUNNER_TEMP/prefix/lib/usi-foundry/examples/demonstration" \
            --staging "$PWD/src/test/resources/fixtures/relationship-bearing-cow.json"
          # The store is a sibling of the registry and every record is labelled non-canonical.
          test -d "$RUNNER_TEMP/home/staged-relationships"
          test "$(find "$RUNNER_TEMP/home/staged-relationships" -name 'stg-*.json' | wc -l)" -gt 0
          if grep -L -E '"certifying"[[:space:]]*:[[:space:]]*false' "$RUNNER_TEMP/home/staged-relationships"/stg-*.json | grep -q .; then
            echo 'A staged record is missing its non-canonical labelling.' >&2
            exit 1
          fi
          if grep -q 'stg-' "$RUNNER_TEMP/home/registry/index.json"; then
            echo 'Staged content leaked into the registry index.' >&2
            exit 1
          fi

      - name: Run evidence is beside the registry, not inside the package
        shell: bash
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/home/runs"
          test "$(find "$RUNNER_TEMP/home/runs" -name 'run-*.json' | wc -l)" -gt 0
          if find "$RUNNER_TEMP/home/packages" -name 'reuse-report.json' | grep -q .; then
            echo 'ADR-0006: a newly manufactured package must not embed run evidence.' >&2
            exit 1
          fi

      - name: Stop
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/app.pid" ]; then kill "$(cat "$RUNNER_TEMP/app.pid")" || true; fi
