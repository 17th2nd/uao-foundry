name: UAO Foundry Final-Head CI Log Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export exact final-head job logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_HEAD: c8e9289b0e054a43f0ef824e18f6cf350238efb3
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          fetch_log() {
            local job_id="$1" name="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" \
              -o "ci-logs/$name.log"
            test -s "ci-logs/$name.log"
          }
          fetch_log 93306586312 31337871984-UAO-Foundry-CI
          fetch_log 93306586232 31337871981-provider-protocol
          fetch_log 93306586170 31337871976-semantic-delta
          fetch_log 93306586182 31337871974-Claude-Code-adapter
          {
            echo "repository=17th2nd/uao-foundry"
            echo "final_candidate_head=$TARGET_HEAD"
            echo "merged_main=cb20687d0b0790622e5b20dd2a530fc9c03aa2cb"
            echo "run 31337871984 job 93306586312 UAO Foundry CI"
            echo "run 31337871981 job 93306586232 provider protocol"
            echo "run 31337871976 job 93306586170 semantic delta"
            echo "run 31337871974 job 93306586182 Claude Code adapter"
          } > ci-logs/MANIFEST.txt
          (cd ci-logs && sha256sum *.log MANIFEST.txt > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Upload CI audit pack
        uses: actions/upload-artifact@v4
        with:
          name: UAO-Foundry-final-head-CI-logs-c8e9289b
          path: ci-logs/
          if-no-files-found: error
          retention-days: 30
