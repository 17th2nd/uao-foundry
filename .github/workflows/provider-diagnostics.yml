name: Provider PR diagnostics

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: startsWith(github.head_ref, 'foundry/provider-protocol')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests and capture diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          mvn -B -ntp clean test > provider-test.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post failure diagnostics
        if: steps.tests.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '## Provider CI diagnostic'
            echo
            echo '```text'
            tail -n 180 provider-test.log
            echo '```'
          } > diagnostic.md
          gh pr comment "$PR_NUMBER" --body-file diagnostic.md

      - name: Fail diagnostic job when tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
