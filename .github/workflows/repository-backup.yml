name: UAO Foundry Repository Backup

on:
  push:
    branches:
      - "backup/**"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manufacture backup payload
        shell: bash
        env:
          TARGET_MAIN_SHA: f1edd9c7aee51fc28f2c7908a75e81efb87b618c
        run: |
          set -euo pipefail
          mkdir -p backup
          git cat-file -e "${TARGET_MAIN_SHA}^{commit}"
          git archive \
            --format=tar.gz \
            --prefix=uao-foundry-${TARGET_MAIN_SHA}/ \
            --output="backup/uao-foundry-source-${TARGET_MAIN_SHA}.tar.gz" \
            "${TARGET_MAIN_SHA}"
          git bundle create "backup/uao-foundry-full-history.bundle" --all
          {
            echo "repository=17th2nd/uao-foundry"
            echo "target_main_sha=${TARGET_MAIN_SHA}"
            echo "backup_workflow_sha=${GITHUB_SHA}"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "FILES AT TARGET MAIN SHA"
            git ls-tree -r --name-only "${TARGET_MAIN_SHA}" | LC_ALL=C sort
          } > backup/BACKUP-MANIFEST.txt
          (
            cd backup
            sha256sum \
              "uao-foundry-source-${TARGET_MAIN_SHA}.tar.gz" \
              uao-foundry-full-history.bundle \
              BACKUP-MANIFEST.txt \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Publish immutable backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: uao-foundry-backup-f1edd9c7-2026-08-10
          path: backup/
          if-no-files-found: error
          retention-days: 90
